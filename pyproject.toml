[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlserver-benchmarks"
version = "0.1.0"
description = "Reproducible, gated benchmark suite for MLServer serving performance (REST/gRPC wire formats, processing placement, runtime tuning)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "aiohttp>=3.9",
    "grpcio>=1.60",
    "numpy>=1.26",
    "scipy>=1.11",
    "kubernetes>=28.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "joblib>=1.3",
    "psutil>=5.9",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "mlserver>=1.7,<1.8",
]

[project.optional-dependencies]
dev = [
    "flake8>=6.0",
    "black>=24.0",
    "pytest>=7.0",
]
gpu = [
    "pynvml>=11.0",
]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["bench/tests", "tools/tests"]
